name: Zynx Update and Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reset to upstream and apply Zynx patch
        run: |
          set -e
          test -f zynx-full.patch || { echo "::error::zynx-full.patch is missing in the repo root"; exit 1; }
          cp zynx-full.patch /tmp/zynx-full.patch
          cp -r .github /tmp/gh_backup
          git fetch --depth=1 https://github.com/ZalithLauncher/ZalithLauncher2 e6528a8491c95dd142a7313ee129e3f8f352894e
          git read-tree --reset -u FETCH_HEAD
          rm -rf .github
          cp -r /tmp/gh_backup .github
          git apply /tmp/zynx-full.patch
          git config user.name "zynx-bot"
          git config user.email "zynx-bot@users.noreply.github.com"
          git add -A
          git commit -m "Zynx update"
          git push

      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run push_ci.yml --ref "${{ github.ref_name }}"
